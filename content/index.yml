contact:
  title: Let's Connect
  description: |
    <p>Have a research challenge that needs a technical partner? Building something at the intersection of XR, science, or deep tech?</p>
    <br>
    <p>I'm open to consulting engagements, research collaborations, and ambitious builds. I work with research institutions, startups, and teams who care about quality and impact.</p>
    <br>
    <p><strong>Let's build something that matters.</strong></p>
