about:
  title: About Me
  description: |
    <p>Over the past 7 years, I've built software at two distinct frontiers: the cutting edge of XR research and the world of product development.</p>
    <br>
    <p>As a VR Engineer at the Fondation Campus Biotech Geneva, I design and build immersive experiments that help neuroscientists from EPFL, UNIGE, and HUG study the brain in new ways — connecting Unity environments with EEG, fMRI, and TMS systems, and training researchers to use the technology themselves.</p>
    <br>
    <p>Beyond research, I'm an active builder. Dragonfly, a 3D platform I helped develop for Airbus at Alltech Consulting, won an Airbus Award for Excellence. I'm currently building Studova, a SaaS platform for research study management, and I hold the Unity Certified Expert: Programmer certification — one of the most advanced in the industry.</p>
    <br>
    <p>I'm a Grande École engineer (Arts et Métiers ParisTech), which means I combine engineering rigor with hands-on curiosity. I've worked in aerospace, cognitive science, neuroscience, and healthtech — and I'm at my best when the problem is genuinely hard.</p>
    <br>
    <p>I'm available for consulting engagements with research institutions, deep tech startups, and teams who want to build something that matters.</p>
  image:
